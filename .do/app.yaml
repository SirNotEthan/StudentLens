name: studentlens
region: nyc

# Backend API Service
services:
  - name: backend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true

    source_dir: /backend

    # Build configuration
    build_command: npm install && npm run build

    # Start command
    run_command: npm start

    # Environment
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Port (App Platform will set PORT automatically)
    http_port: 5000

    # Environment variables
    envs:
      - key: NODE_ENV
        value: production

      - key: APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1

      - key: APPWRITE_PROJECT_ID
        value: 68d57fc30010b8c4f2f1
        type: SECRET

      - key: APPWRITE_API_KEY
        value: YOUR_APPWRITE_API_KEY_HERE
        type: SECRET

      - key: APPWRITE_DATABASE_ID
        value: 68e0023400197e1cf89a
        type: SECRET

      - key: APPWRITE_USERS_COLLECTION_ID
        value: users

      - key: APPWRITE_POSTS_COLLECTION_ID
        value: posts

      - key: APPWRITE_COMMENTS_COLLECTION_ID
        value: comments

      - key: APPWRITE_APPLICATIONS_COLLECTION_ID
        value: writer_applications

      - key: JWT_SECRET
        value: YOUR_JWT_SECRET_HERE
        type: SECRET

      - key: JWT_EXPIRE
        value: 7d

      - key: SESSION_SECRET
        value: YOUR_SESSION_SECRET_HERE
        type: SECRET

      - key: GOOGLE_CLIENT_ID
        value: YOUR_GOOGLE_CLIENT_ID
        type: SECRET

      - key: GOOGLE_CLIENT_SECRET
        value: YOUR_GOOGLE_CLIENT_SECRET
        type: SECRET

      - key: GOOGLE_CALLBACK_URL
        value: ${APP_URL}/api/auth/google/callback

      - key: CLIENT_URL
        value: ${APP_URL}

      - key: SECURE_COOKIES
        value: "true"

      - key: ADMIN_IP_WHITELIST_ENABLED
        value: "false"

# Frontend Static Site
static_sites:
  - name: frontend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true

    # Build configuration
    build_command: npm install && npm run build
    output_dir: /dist

    # Environment variables for build
    envs:
      - key: VITE_API_BASE_URL
        value: ${backend.PUBLIC_URL}/api

      - key: VITE_BACKEND_URL
        value: ${backend.PUBLIC_URL}

    # Routes - send API requests to backend
    routes:
      - path: /api
        preserve_path_prefix: true

    # Catchall route for SPA
    catchall_document: index.html
