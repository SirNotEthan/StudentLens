name: studentlens
region: nyc

# Combined Frontend + Backend Service
services:
  - name: app
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true

    # Build from root directory
    source_dir: /

    # Build configuration - builds both frontend and backend
    build_command: |
      echo "Building frontend..."
      npm install
      npm run build
      echo "Building backend..."
      cd backend
      npm install
      npm run build
      echo "Copying frontend to backend public directory..."
      mkdir -p dist/public
      cp -r ../dist/* dist/public/
      echo "Build complete!"

    # Start command - runs the backend server which also serves frontend
    run_command: cd backend && npm start

    # Environment
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Port (App Platform will set PORT automatically, usually 8080)
    http_port: 8080

    # Environment variables
    envs:
      - key: NODE_ENV
        value: production

      - key: APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1

      - key: APPWRITE_PROJECT_ID
        value: 68d57fc30010b8c4f2f1
        type: SECRET

      - key: APPWRITE_API_KEY
        value: YOUR_APPWRITE_API_KEY_HERE
        type: SECRET

      - key: APPWRITE_DATABASE_ID
        value: 68e0023400197e1cf89a
        type: SECRET

      - key: APPWRITE_USERS_COLLECTION_ID
        value: users

      - key: APPWRITE_POSTS_COLLECTION_ID
        value: posts

      - key: APPWRITE_COMMENTS_COLLECTION_ID
        value: comments

      - key: APPWRITE_APPLICATIONS_COLLECTION_ID
        value: writer_applications

      - key: JWT_SECRET
        value: YOUR_JWT_SECRET_HERE
        type: SECRET

      - key: JWT_EXPIRE
        value: 7d

      - key: SESSION_SECRET
        value: YOUR_SESSION_SECRET_HERE
        type: SECRET

      - key: GOOGLE_CLIENT_ID
        value: YOUR_GOOGLE_CLIENT_ID
        type: SECRET

      - key: GOOGLE_CLIENT_SECRET
        value: YOUR_GOOGLE_CLIENT_SECRET
        type: SECRET

      - key: GOOGLE_CALLBACK_URL
        value: ${APP_URL}/api/auth/google/callback

      # Frontend URL for CORS configuration
      # Since frontend and backend are served from same domain, use APP_URL
      - key: CLIENT_URL
        value: ${app.PUBLIC_URL}

      - key: SECURE_COOKIES
        value: "true"

      - key: ADMIN_IP_WHITELIST_ENABLED
        value: "false"

      # Frontend build-time environment variables
      # These are used during the build process to configure the frontend
      - key: VITE_API_BASE_URL
        value: /api

      - key: VITE_BACKEND_URL
        value: ""
